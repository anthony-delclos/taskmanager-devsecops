server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Bench – hide server version
    server_tokens off;

    # OWASP A05 – security headers on all responses
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"              always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"       always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
        always;

    # API proxy → backend container (keeps CORS simple: same-origin from browser)
    location /api {
        proxy_pass         http://back:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_hide_header  X-Powered-By;
    }

    # Angular SPA – fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
