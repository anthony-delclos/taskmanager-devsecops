global:
  scrape_interval: 15s      # collecte les métriques toutes les 15s
  evaluation_interval: 15s

scrape_configs:

  # Métriques des conteneurs Docker
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Métriques de la VM
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Métriques de l'API .NET
  - job_name: api
    static_configs:
      - targets: ['api:5000']
    metrics_path: /metrics