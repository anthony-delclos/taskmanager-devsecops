# ============================================================
# ANSIBLE CONFIGURATION — PROJET DEVSECOPS
# Transport : AWS SSM Session Manager (pas SSH)
# Port 22 volontairement fermé sur le Security Group Terraform.
# Chaque connexion est auditée via AWS CloudTrail automatiquement.
# ============================================================

[defaults]
inventory      = inventory/hosts.yml
remote_user    = ec2-user
roles_path     = ./roles

# Supprimé : private_key_file = ~/.ssh/id_rsa (SSH désactivé)

# Inutile avec SSM (pas de fingerprint SSH à vérifier), conservé
# pour compatibilité si un test SSH est lancé manuellement
host_key_checking = False

# Traçabilité locale des runs Ansible
log_path = /tmp/ansible-devsecops.log

# 1 seule instance dans ce projet — valeur conservatrice
forks = 5

# SSM exécute les commandes via un utilisateur système qui n'a pas
# accès à /home/ec2-user → on force tmp dans /tmp accessible à tous
remote_tmp = /tmp/.ansible/tmp

# ============================================================
# PLUGIN DE CONNEXION SSM — PRÉREQUIS NŒUD DE CONTRÔLE
#
# 1. Installer les collections Ansible :
#    ansible-galaxy collection install community.aws amazon.aws
#
# 2. Installer les dépendances Python :
#    pip install boto3 botocore
#
# 3. Installer le Session Manager Plugin AWS CLI :
#    https://docs.aws.amazon.com/systems-manager/latest/userguide/
#    session-manager-working-with-install-plugin.html
#
# 4. Configurer le profil AWS local :
#    aws configure --profile your-aws-sso-profile
#
# La connexion SSM est déclarée dans inventory/hosts.yml
# (ansible_connection: community.aws.aws_ssm)
# ============================================================

[ssh_connection]
# SSH désactivé — aucun fallback SSH ne doit se produire
ssh_args = -o ControlMaster=no
