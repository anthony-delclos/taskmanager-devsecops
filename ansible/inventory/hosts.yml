# ============================================================
# INVENTAIRE STATIQUE — PROJET DEVSECOPS
#
# IMPORTANT : l'hôte est ciblé par son instance_id AWS (SSM),
# et non par une adresse IP. Cela évite toute dépendance à
# une IP potentiellement changeante après redémarrage.
#
# instance_id issu de : terraform output instance_id
# Valeur actuelle     : i-04505dbb91806e12a
#
# Pour un inventaire 100% dynamique (recommandé en production),
# utiliser le plugin aws_ec2 décrit dans inventory/aws_ec2.yml
# ============================================================

all:
  children:
    ec2:
      hosts:
        # Clé = instance_id AWS → cible directe pour SSM
        # (remplace l'ancienne IP statique 13.39.25.165)
        i-04505dbb91806e12a:

      vars:
        # --------------------------------------------------
        # Connexion : AWS SSM Session Manager
        # Plugin    : community.aws.aws_ssm
        # Pas de SSH, pas de clé privée, pas de port 22
        # --------------------------------------------------
        ansible_connection: community.aws.aws_ssm

        # ID de l'instance (requis explicitement par le plugin SSM)
        ansible_aws_ssm_instance_id: "i-04505dbb91806e12a"

        # Région AWS où se trouve l'instance
        ansible_aws_ssm_region: "eu-west-3"

        # Profil AWS CLI local utilisé pour l'authentification
        # Profil AWS CLI — NE PAS décommenter en CI/CD
        # Les credentials sont injectés via OIDC (variables d'env AWS_*)
        # En local uniquement : ansible_aws_ssm_profile: "devesecops_project_final_ajele"

        # Bucket S3 utilisé par le plugin SSM pour transférer les
        # fichiers temporaires entre le nœud de contrôle et l'instance.
        # TODO : s'assurer que l'IAM role EC2 (devsecops-ssm-role)
        #        a les droits s3:GetObject + s3:PutObject sur ce bucket
        ansible_aws_ssm_bucket_name: "devsecops-tfstate-ajele"

        # Préfixe S3 pour isoler les fichiers temporaires Ansible
        ansible_aws_ssm_bucket_prefix: "ansible-ssm-tmp"

        # Délai de connexion SSM (secondes)
        ansible_aws_ssm_timeout: 60

        # Interpréteur Python sur l'instance Amazon Linux 2023
        ansible_python_interpreter: /usr/bin/python3

        # Utilisateur de connexion sur l'instance EC2
        ansible_user: ec2-user
